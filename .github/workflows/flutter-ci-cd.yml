name: BasicUserApp CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-check:
    name: Backend validation and Render deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check server.js

      - name: Trigger Render deployment (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment triggered."
          else
            echo "RENDER_DEPLOY_HOOK is not configured; backend deployment skipped."
          fi

  flutter-build:
    name: Flutter analyze, test and Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: frontend/pubspec.lock

      - name: Configure Android release signing
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

            cat > key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

            echo "Original APK signing key configured."

          elif [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ERROR: Signing secrets are required for main branch and release builds."
            exit 1

          else
            echo "Pull request build: using debug signing because repository secrets may be unavailable."
          fi

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test

      - name: Read app version from pubspec.yaml
        id: app_version
        working-directory: frontend
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/^version: \([0-9.]*\)+[0-9]*/\1/p' pubspec.yaml)"
          APP_BUILD_NUMBER="$(sed -n 's/^version: [0-9.]*+\([0-9]*\)/\1/p' pubspec.yaml)"

          if [ -z "$APP_VERSION" ] || [ -z "$APP_BUILD_NUMBER" ]; then
            echo "Could not read version from frontend/pubspec.yaml"
            exit 1
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: frontend
        run: |
          flutter build apk --release \
            --build-name "${{ steps.app_version.outputs.version }}" \
            --build-number "${{ steps.app_version.outputs.build_number }}" \
            --dart-define=APP_VERSION="${{ steps.app_version.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ steps.app_version.outputs.build_number }}"

      - name: Rename APK with version
        run: |
          mkdir -p release

          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
            "release/BasicUserApp-${{ steps.app_version.outputs.version }}+${{ steps.app_version.outputs.build_number }}.apk"

          cp frontend/build/app/outputs/flutter-apk/app-release.apk release/app-release.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasicUserApp-android-${{ steps.app_version.outputs.version }}-${{ steps.app_version.outputs.build_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BasicUserApp ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/app-release.apk
            release/BasicUserApp-${{ steps.app_version.outputs.version }}+${{ steps.app_version.outputs.build_number }}.apk